<div class="slide-display-container">
  <div class="loading-file" *ngIf="loading" role="status" aria-label="Đang tải trang"><img src="images/images/file-loading.gif" alt="" /></div>
  <div class="request-error" *ngIf="loadError" role="alert">Không tải được trang. <button (click)="retryImage()">Thử lại</button></div>
  <p class="document-empty" *ngIf="!listImagePaths.length">Chưa có bản xem trước. Bạn có thể tải tài liệu bằng nút tải xuống.</p>
  <img
    class="back-icon"
    title="Trở về"
    src="icons/back-icon.png"
    alt=""
    (click)="onBack()"
  />
  <a [href]="imageDownloadUrl" download target="_blank"
    ><img class="download" title="Tải file" src="icons/download.png" alt=""
  /></a>
  <div class="list-images">
    <img
      class="left-arrow"
      src="icons/left-arrow.png"
      (click)="setActiveImg(-1)"
      alt=""
    />
    <img
      class="right-arrow"
      src="icons/right-arrow.png"
      (click)="setActiveImg(1)"
      alt=""
    />
    <div class="image" *ngIf="listImagePaths.length && !loadError">
      <img
        [class.active-img]="!loading"
        [src]="previews.url(listImagePaths[activeImg])"
        decoding="async"
        [alt]="'Trang ' + (activeImg + 1)" (load)="imageLoaded($event)" (error)="imageFailed()"
      />
    </div>
  </div>
</div>
