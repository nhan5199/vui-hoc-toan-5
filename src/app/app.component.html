<div class="body" style="position: relative">
  <div *ngIf="navigating" class="loading route-loading" role="status" aria-label="Đang tải nội dung"></div>
  <div *ngIf="navigationFailed" class="request-error" role="alert">Không tải được nội dung. <button (click)="retryNavigation()">Thử lại</button></div>
  <app-menu></app-menu>
  <img
    class="back-icon"
    title="Trở về"
    src="icons/back-icon.png"
    alt=""
    (click)="onBack()"
  />
  <router-outlet></router-outlet>
</div>
