<p *ngIf="loadError" role="alert">Không tải được câu hỏi. Vui lòng tải lại trang để thử lại.</p>
<div class="loading" *ngIf="isLoading"></div>
<div class="cau-hoi-on-tap" [class.hidden]="isLoading">
  <div class="cau-hoi-on-tap-container">
    <app-cau-hoi-on-tap-button
      *ngFor="let item of listQuestionAnswer"
      [buttonName]="item.topicName"
      [buttonIcon]="''"
      [navigateUrl]="item.topicUrl"
    ></app-cau-hoi-on-tap-button>
  </div>
</div>
